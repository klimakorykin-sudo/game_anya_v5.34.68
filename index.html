<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🏫 Хранительница Школы</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            background: #0a0a1a;
            overflow: hidden;
            touch-action: none;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a1a2e;
            overflow: hidden;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
            cursor: default;
            background: #1a1a2e;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a1a;
            z-index: 10;
            transition: opacity 0.5s ease;
            padding: 20px;
        }
        
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        #loadingScreen .title {
            font-size: clamp(28px, 6vw, 56px);
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
            text-align: center;
            animation: glow 2s ease-in-out infinite;
        }
        
        #loadingScreen .subtitle {
            font-size: clamp(16px, 2.5vw, 24px);
            color: #8888aa;
            margin-bottom: 30px;
            text-align: center;
        }
        
        #loadingScreen .loading-bar {
            width: 200px;
            max-width: 80%;
            height: 4px;
            background: #2d3436;
            border-radius: 2px;
            overflow: hidden;
        }
        
        #loadingScreen .loading-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff6b6b);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        #loadingScreen .controls-hint {
            margin-top: 30px;
            font-size: clamp(12px, 1.8vw, 18px);
            color: #666688;
            text-align: center;
            line-height: 1.8;
        }
        
        #loadingScreen .controls-hint span {
            display: inline-block;
            background: #1a1a2e;
            padding: 2px 10px;
            border: 1px solid #2d3436;
            border-radius: 4px;
            margin: 0 2px;
            color: #ffffff;
            font-size: 0.9em;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
            50% { text-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }
        }
        
        @media (max-width: 600px) {
            #loadingScreen .controls-hint {
                font-size: 11px;
                line-height: 1.6;
            }
            #loadingScreen .controls-hint span {
                padding: 1px 6px;
                font-size: 0.8em;
            }
        }
        
        @media (max-height: 500px) {
            #loadingScreen .controls-hint {
                margin-top: 10px;
                font-size: 10px;
            }
            #loadingScreen .subtitle {
                margin-bottom: 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="loadingScreen">
            <div class="title">🏫 Хранительница Школы</div>
            <div class="subtitle">✨ История начинается здесь... ✨</div>
            <div class="loading-bar">
                <div class="fill" id="loadingFill"></div>
            </div>
            <div class="controls-hint">
                <span>WASD</span> или <span>←↑↓→</span> — движение<br>
                <span>Пробел</span> — атака<br>
                📱 На телефоне: касайся экрана!
            </div>
        </div>
    </div>
    
    <!-- ====== ВСЕ СКРИПТЫ (БЕЗ abilities.js) ====== -->
    <script src="js/config.js"></script>
    <script src="js/input.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/player.js"></script>
    <script src="js/items.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        let loadedFiles = 0;
        const totalFiles = 10;
        
        function updateLoading() {
            loadedFiles++;
            const percent = Math.min(100, (loadedFiles / totalFiles) * 100);
            const fill = document.getElementById('loadingFill');
            if (fill) fill.style.width = percent + '%';
            if (loadedFiles >= totalFiles) {
                setTimeout(() => {
                    const screen = document.getElementById('loadingScreen');
                    if (screen) screen.classList.add('hidden');
                }, 500);
            }
        }
        
        document.querySelectorAll('script[src]').forEach(script => {
            script.addEventListener('load', updateLoading);
            script.addEventListener('error', updateLoading);
        });
        
        setTimeout(() => {
            const fill = document.getElementById('loadingFill');
            if (fill && fill.style.width === '0%') {
                fill.style.width = '100%';
                setTimeout(() => {
                    const screen = document.getElementById('loadingScreen');
                    if (screen) screen.classList.add('hidden');
                }, 500);
            }
        }, 3000);
    </script>
</body>
</html>
